name: CD - Deploy Spring Boot API to Ubuntu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.PROD_APP_DIR }}      # 예: /home/ubuntu/audigo_back_spring
      SERVICE: ${{ secrets.PROD_SERVICE }}      # 예: springboot-audigo.service
      SPRING_PROFILE: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build (Gradle)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean bootJar -x test
          ls -al build/libs

      - name: Find boot JAR (exclude -plain.jar)
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE=$(ls -t build/libs/*.jar | grep -v -- '-plain\.jar$' | head -n1)
          if [ -z "${JAR_FILE:-}" ]; then
            echo "No boot JAR found in build/libs" >&2
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "JAR_BASE=$(basename "$JAR_FILE")" >> "$GITHUB_ENV"

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare dirs on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${{ env.APP_DIR }}/releases" "${{ env.APP_DIR }}/build/libs"

      - name: Upload JAR to server
       
