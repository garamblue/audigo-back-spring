name: CI - Lightweight checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle Wrapper 무결성 검증 (자바 설치 불필요)
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2